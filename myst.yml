project:
  id: 7c994f0a-9f4b-401e-a7e6-153b5ac9423f
  title: Managing Digital Collections
  subtitle: A Guide to Open-Source Digital Cultural Heritage Management with Python
  #date: 2026-07-29
  venue: 
    #Preferred Citation block; note that series is being repurposed
    series: "Preferred Citation:"
    location: Ann Arbor
    date: "2026"
    publisher: University of Michigan School of Information
    #url: "TBD"
  description: This online book offers an overview and introduction to how to manage digital collections, with a focus on metadata, batch programming techniques, and open source systems. The book was initiated as a course textbook, which is still evident in the associated pages describing assignments, schedule, and some of the tooling. More broadly, however, the book aims to provide an open-source and interactive series of examples that illustrate concepts, techniques, and overall frameworks for managing digital collections (that is, digitized and digital content that is managed by libraries, archives, museums, and other cultural heritage organizations, including community archives).
  keywords:
    - digital collections
    - python
    - metadata
    - programming
    - cultural heritage
  github: jesseajohnston/managing-digital-collections
  bibliography: references.bib
  # this changes the default label for code from program to code block
  numbering:
    code:
      enabled: true
      template: "Code Block\u00A0%s"
  toc:
    #- file: cover.md
    - file: ./index.md
    - file: ./introduction/index.md
      children:
        - file: ./introduction/setup.md
    - file: ./part01/index.md
      children:
        - file: ./part01/01-open-source-libraries.md
        - file: ./part01/02-brief-history-open-libraries.md
        - file: ./part01/03-open-standards-on-the-web.md
        - file: ./part01/04-open-data-formats.md # data formats
        #- file: example of working with  related to collection builder)
    - file: ./part02/index.md
      children:
        - file: ./part02/01-metadata-for-digital-collections.md
        - file: ./part02/02-some-metadata-considerations.md
        - file: ./part02/xml-01-basics-with-BS4.ipynb #make optional?
        # here add intro with ET and EAD . . . https://github.com/morskyjezek/si676-2025-data/blob/main/examples/xml-intro-basic-functions-ET.ipynb
        - file: ./part02/xml-02-xpath.ipynb
          title: Searching with XPath
        - file: ./part02/xml-03-advanced-MODS.ipynb
    - file: ./part03/index.md
      children: []
        # TODO: add chapters — see plan_changing_to_book_update_202607.md, Part 3
    - title: "Part 4: Presenting and Managing Collections"
      children: []
        # TODO: add chapters — see plan_changing_to_book_update_202607.md, Part 4
    - file: ./labs/index.md
      children:
        # a list of labs would go here
        - file: ./labs/lab-04-jekyll.md
          title: "Lab 4: Setting Up CollectionBuilder"
  exports:
    - format: typst
      template: ./templates/plain_typst_book_custom #lapreprint-typst #plain_typest_book
      articles:
        #- index.md index file is only used for online version
        # Introduction
        - ./introduction/index.md
        - ./introduction/setup.md #may not be necessary in pdf?
        # Part 1
        - ./part01/index.md
        - ./part01/01-open-source-libraries.md
        - ./part01/02-brief-history-open-libraries.md
        - ./part01/03-open-standards-on-the-web.md
        - ./part01/04-open-data-formats.md
        # Part 2
        - ./part02/index.md
        - ./part02/01-metadata-for-digital-collections.md
        #- ./part02/02-some-metadata-considerations.md
        - ./part02/xml-01-basics-with-BS4.ipynb #make optional?
        # here add an additional basics with ET, to highlight native XML
        - file: ./part02/xml-02-xpath.ipynb
          title: Introduction to XPath
        - ./part02/xml-03-advanced-MODS.ipynb
        # Part 3
        - ./part03/index.md
        # Labs Section (include?)
        - ./labs/index.md
        - ./labs/lab-04-jekyll.md
      output: ./_build/exports/managing-digital-collections-beta.pdf
      id: typst-book-pdf
      show_pagenumber: true
      papersize: us-letter
      edition: August 2026 edition
      # experimental redesigned ToC, rendered after the standard one for comparison
      show_ToC2: true
      ToC2_depth: 2
      ToC2_title: "Contents (testing template)"
      # top-level groups: "Part N: …" plus the Labs section (single-quoted so
      # YAML keeps the doubled backslashes Typst needs in a string literal)
      ToC2_part_pattern: '^\\s*(Part\\s+[0-9IVXLC]+|Labs)\\b'
